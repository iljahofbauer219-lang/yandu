services:
  db:
    image: postgres:16
    container_name: yandu-db
    restart: always
    env_file: .env
    environment:
      POSTGRES_DB: yandu
      POSTGRES_USER: yandu
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yandu -d yandu"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: yandu-app
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql://yandu:${DB_PASSWORD}@db:5432/yandu
    volumes:
      - media-data:/app/data/media
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  media-data:
