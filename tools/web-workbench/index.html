<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>砚都跨境 · AI员工 Web 工作台</title>
<style>
  :root { --brand:#0abab5; --brand-dark:#079d98; --ink:#1f2329; --muted:#646a73; --line:#e5e8eb; --bg:#f5f6f8; --danger:#a33d36; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); margin:0; color:var(--ink); height:100vh; display:flex; flex-direction:column; }
  header { flex:none; background:#fff; border-bottom:1px solid var(--line); padding:12px 20px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand-mark { display:grid; place-items:center; width:34px; height:34px; border-radius:11px; background:var(--brand); color:#fff; font-weight:900; font-size:16px; }
  .brand b { font-size:15px; display:block; }
  .brand small { color:var(--muted); font-size:11px; }
  .agents { display:flex; gap:8px; margin-left:8px; flex-wrap:wrap; }
  .agent-chip { border:1px solid var(--line); background:#fff; border-radius:20px; padding:7px 14px; font-size:13px; cursor:pointer; color:var(--muted); }
  .agent-chip.active { border-color:var(--brand); background:#e1f8f6; color:var(--brand-dark); font-weight:600; }
  .spacer { flex:1; }
  header .link { font-size:12px; color:var(--muted); text-decoration:none; border:1px solid var(--line); border-radius:8px; padding:6px 10px; background:#fff; }
  header .link:hover { color:var(--brand-dark); border-color:var(--brand); }
  .user-chip { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); }
  .user-chip b { color:var(--ink); font-size:13px; }
  .user-chip button { border:1px solid var(--line); background:#fff; border-radius:7px; font-size:12px; color:var(--muted); padding:5px 10px; cursor:pointer; }
  .user-chip button:hover { color:var(--danger); border-color:var(--danger); }
  main { flex:1; min-height:0; display:flex; flex-direction:column; max-width:900px; width:100%; margin:0 auto; padding:16px; gap:12px; }
  #chat { flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:12px; padding:4px; }
  .msg { max-width:86%; padding:12px 14px; border-radius:14px; font-size:14px; line-height:1.7; word-break:break-word; }
  .msg-user { align-self:flex-end; background:var(--brand); color:#fff; border-bottom-right-radius:4px; white-space:pre-wrap; }
  .msg-ai { align-self:flex-start; background:#fff; border:1px solid var(--line); border-bottom-left-radius:4px; }
  .msg-ai .md { overflow-wrap:anywhere; }
  .msg-ai .md h1,.msg-ai .md h2,.msg-ai .md h3 { margin:14px 0 8px; line-height:1.4; }
  .msg-ai .md h1 { font-size:18px; } .msg-ai .md h2 { font-size:16px; } .msg-ai .md h3 { font-size:15px; }
  .msg-ai .md p { margin:6px 0; }
  .msg-ai .md ul,.msg-ai .md ol { margin:6px 0; padding-left:22px; }
  .msg-ai .md table { border-collapse:collapse; margin:10px 0; font-size:13px; display:block; overflow-x:auto; max-width:100%; }
  .msg-ai .md th,.msg-ai .md td { border:1px solid var(--line); padding:6px 10px; text-align:left; }
  .msg-ai .md th { background:#f2f7f7; }
  .msg-ai .md a { color:var(--brand-dark); }
  .msg-ai .md code { background:#f2f4f5; border-radius:4px; padding:1px 5px; font-size:12.5px; }
  .msg-ai .md pre { background:#f6f8f9; border-radius:8px; padding:10px; overflow-x:auto; }
  .msg-ai .md pre code { background:none; padding:0; }
  .msg-ai .md blockquote { border-left:3px solid var(--brand); margin:8px 0; padding:2px 12px; color:var(--muted); background:#f4fbfa; }
  .msg-actions { display:flex; gap:8px; margin-top:8px; border-top:1px dashed var(--line); padding-top:8px; }
  .msg-actions button { border:1px solid var(--line); background:#fff; border-radius:7px; font-size:12px; color:var(--muted); padding:4px 10px; cursor:pointer; }
  .msg-actions button:hover { color:var(--brand-dark); border-color:var(--brand); }
  .msg-error { align-self:flex-start; background:#fff0ee; border:1px solid #f3c1bc; color:var(--danger); }
  .empty { text-align:center; color:var(--muted); font-size:13px; margin-top:60px; line-height:2; }
  footer { flex:none; max-width:900px; width:100%; margin:0 auto; padding:0 16px 14px; }
  .composer { display:flex; flex-direction:column; gap:8px; }
  .composer-tools { display:flex; align-items:center; gap:8px; flex-wrap:wrap; min-height:30px; }
  .tool-btn { border:1px solid var(--line); background:#fff; border-radius:8px; font-size:12px; color:var(--muted); padding:6px 10px; cursor:pointer; }
  .tool-btn:hover { color:var(--brand-dark); border-color:var(--brand); }
  .attach-chips { display:flex; gap:6px; flex-wrap:wrap; }
  .attach-chip { display:inline-flex; align-items:center; gap:6px; background:#e1f8f6; border:1px solid var(--brand); color:var(--brand-dark); border-radius:14px; font-size:11px; padding:4px 10px; }
  .attach-chip button { border:none; background:none; color:var(--brand-dark); cursor:pointer; font-size:12px; padding:0; }
  .platforms { display:flex; gap:6px; flex-wrap:wrap; margin-left:auto; }
  .plat-chip { border:1px solid var(--line); background:#fff; border-radius:8px; font-size:12px; color:var(--muted); padding:5px 10px; cursor:pointer; }
  .plat-chip.active { border-color:var(--brand); background:#e1f8f6; color:var(--brand-dark); font-weight:600; }
  .composer-row { display:flex; gap:10px; align-items:flex-end; }
  .greeting { text-align:center; margin:0 0 4px; font-size:20px; font-weight:600; color:var(--ink); }
  .suggestions { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; max-width:640px; width:100%; margin:0 auto; }
  .suggestions button { padding:12px 16px; font-size:12px; color:var(--muted); background:#fff; border:1px solid var(--line); border-radius:10px; text-align:left; cursor:pointer; }
  .suggestions button:hover { color:var(--brand-dark); border-color:var(--brand); background:#f4fbfa; }
  footer textarea { flex:1; resize:none; border:1px solid var(--line); border-radius:12px; padding:12px 14px; font-size:14px; font-family:inherit; height:76px; outline:none; background:#fff; }
  footer textarea:focus { border-color:var(--brand); box-shadow:0 0 0 3px rgba(10,186,181,.15); }
  .send-btn { flex:none; border:none; background:var(--brand); color:#fff; border-radius:12px; padding:0 22px; height:76px; font-size:15px; font-weight:600; cursor:pointer; }
  .send-btn:hover { background:var(--brand-dark); }
  .send-btn:disabled { opacity:.5; cursor:not-allowed; }
  .tip { flex:none; max-width:900px; width:100%; margin:0 auto; padding:0 20px 12px; font-size:11px; color:#98a0a8; }
  .tip a { color:var(--muted); }
  .typing { display:inline-flex; gap:4px; align-items:center; color:var(--muted); font-size:13px; }
  .typing i { width:6px; height:6px; border-radius:50%; background:var(--brand); animation:blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay:.2s; } .typing i:nth-child(3) { animation-delay:.4s; }
  @keyframes blink { 0%,80%,100% { opacity:.25; } 40% { opacity:1; } }
  .login-wrap { position:fixed; inset:0; background:var(--bg); display:grid; place-items:center; z-index:50; }
  .login-card { width:340px; background:#fff; border:1px solid var(--line); border-radius:16px; padding:32px 28px; box-shadow:0 12px 40px rgba(31,35,41,.08); text-align:center; }
  .login-card .brand-mark { margin:0 auto 10px; width:44px; height:44px; font-size:20px; border-radius:14px; }
  .login-card h1 { font-size:17px; margin:0 0 4px; }
  .login-card p.sub { font-size:12px; color:var(--muted); margin:0 0 20px; }
  .login-card input { display:block; width:100%; border:1px solid var(--line); border-radius:10px; padding:11px 13px; font-size:14px; margin-bottom:12px; outline:none; font-family:inherit; }
  .login-card input:focus { border-color:var(--brand); box-shadow:0 0 0 3px rgba(10,186,181,.15); }
  .login-err { min-height:18px; font-size:12px; color:var(--danger); margin-bottom:8px; text-align:left; }
  .login-card button { width:100%; border:none; background:var(--brand); color:#fff; border-radius:10px; padding:12px; font-size:15px; font-weight:600; cursor:pointer; }
  .login-card button:hover { background:var(--brand-dark); }
  .login-card button:disabled { opacity:.5; cursor:not-allowed; }
  .login-card p.foot { font-size:11px; color:#98a0a8; margin:14px 0 0; line-height:1.7; }
</style>
</head>
<body>
<div class="login-wrap" id="loginWrap">
  <form class="login-card" id="loginForm">
    <div class="brand-mark">砚</div>
    <h1>AI员工 · Web 工作台</h1>
    <p class="sub">使用桌面 APP 账号登录（手机号 + 密码）</p>
    <input id="loginPhone" maxlength="11" autocomplete="username" placeholder="手机号" required>
    <input id="loginPwd" type="password" autocomplete="current-password" placeholder="密码" required>
    <div class="login-err" id="loginErr"></div>
    <button id="loginBtn" type="submit">登 录</button>
    <p class="foot">没有账号？请在桌面 APP 注册并等待管理员审核。<br>报告方案类工作浏览器直接使用，无需安装 APP。</p>
  </form>
</div>
<header>
  <div class="brand"><span class="brand-mark">砚</span><div><b>AI员工 · Web 工作台</b><small>报告方案类工作浏览器直接使用，无需安装 APP</small></div></div>
  <div class="agents" id="agents"></div>
  <div class="spacer"></div>
  <div class="user-chip" id="userChip"><b id="userName"></b><button id="logoutBtn" type="button">退出</button></div>
  <a class="link" href="/download/" target="_blank">APP 下载页 ↗</a>
</header>
<main>
  <div id="chat"><div class="empty" id="empty">选择上方 AI 员工，输入需求即可生成报告。<br>例如：「帮我分析美国站宠物美容刷市场，给出选品报告」</div></div>
</main>
<footer>
  <div class="composer">
    <div class="composer-tools">
      <button class="tool-btn" id="uploadBtn" type="button">📎 上传</button>
      <input type="file" id="fileInput" accept=".txt,.md" hidden>
      <span class="attach-chips" id="attachChips"></span>
      <span class="platforms" id="platforms"></span>
    </div>
    <div class="composer-row">
      <textarea id="input" placeholder="描述你的需求（Ctrl/⌘ + Enter 发送）"></textarea>
      <button class="send-btn" id="send">发送</button>
    </div>
  </div>
</footer>
<div class="tip">报告生成约需 1~6 分钟，期间请勿关闭页面。桌面快捷方式下载：<a href="/web/yandu-web.url">Windows</a> · <a href="/web/yandu-web.webloc">macOS</a></div>
<script src="/web/marked.min.js"></script>
<script src="/web/purify.min.js"></script>
<script>
const AGENTS = [
  { id: '8563cdb690e611f1b36bf39ef484774d', name: '选品分析师', placeholder: '例如：分析美国站宠物美容刷市场，输出选品报告' },
  { id: 'a80d0348932d11f1b36bf39ef484774d', name: 'Listing精造师', placeholder: '例如：把以下中文商品资料生成 eBay 美国站英文 Listing：…' }
]
const AUTH_KEY = 'yw_auth'
const PLATFORMS = ['Amazon', 'eBay', 'Ozon', 'Temu', 'TikTok', 'eMAG', 'Lazada']
const PLATFORM_TEXT_RE = /(在\s*)(亚马逊|Amazon|eBay|Ozon|Temu|TikTok|eMAG|Lazada)/
function applyPlatformToRequest(text, platform) {
  const target = !platform || platform === 'Amazon' ? '亚马逊' : platform
  return PLATFORM_TEXT_RE.test(text) ? text.replace(PLATFORM_TEXT_RE, (_m, prefix) => prefix + target) : text
}
const SAMPLES = {
  [AGENTS[0].id]: [
    '帮我分析一款宠物用品在亚马逊的市场机会',
    '如何判断一个产品在 1688 上的竞争程度？',
    '跨境电商选品有哪些常见误区？',
    '亚马逊 FBA 和 FBM 的区别是什么？',
    '如何评估一款产品的利润空间？',
    '1688 上如何找到靠谱的供应商？'
  ],
  [AGENTS[1].id]: [
    '把以下中文商品资料生成 eBay 美国站英文 Listing：宠物美容刷，去浮毛设计，适合长毛猫狗',
    '将这段 Listing 标题优化并嵌入关键词：Pet Grooming Brush for Dogs',
    '把以下亚马逊 Listing 翻译成德语，用于德国站：…',
    '为 Shopee 马来西亚站写 5 条马来语卖点 bullet points：宠物除毛梳'
  ]
}
const DOC_CHAR_LIMIT = 12000
const DOC_MAX_COUNT = 3
const state = { agent: AGENTS[0], history: Object.fromEntries(AGENTS.map(a => [a.id, []])), busy: false, platform: '', attachments: [] }
const chatEl = document.getElementById('chat')
const inputEl = document.getElementById('input')
const sendEl = document.getElementById('send')
const agentsEl = document.getElementById('agents')
const loginWrap = document.getElementById('loginWrap')
const loginForm = document.getElementById('loginForm')
const loginErr = document.getElementById('loginErr')
const loginBtn = document.getElementById('loginBtn')
const userChip = document.getElementById('userChip')
const userNameEl = document.getElementById('userName')

// ─── 登录态（sessionStorage，关浏览器即失效） ─────────────────────────────
function loadAuth() { try { return JSON.parse(sessionStorage.getItem(AUTH_KEY)) } catch { return null } }
function saveAuth(auth) { sessionStorage.setItem(AUTH_KEY, JSON.stringify(auth)) }
function clearAuth() { sessionStorage.removeItem(AUTH_KEY) }

function showLogin(message) {
  if (message) loginErr.textContent = message
  loginWrap.style.display = 'grid'
  userChip.style.display = 'none'
}

function enterWorkbench() {
  const auth = loadAuth()
  loginWrap.style.display = 'none'
  userNameEl.textContent = auth?.name || '已登录'
  userChip.style.display = 'flex'
}

loginForm.addEventListener('submit', async event => {
  event.preventDefault()
  loginErr.textContent = ''
  const phone = document.getElementById('loginPhone').value.trim()
  const password = document.getElementById('loginPwd').value
  if (!/^1\d{10}$/.test(phone)) { loginErr.textContent = '手机号格式不正确'; return }
  loginBtn.disabled = true
  try {
    const response = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: phone, password })
    })
    const body = await response.json().catch(() => ({}))
    if (!response.ok) { loginErr.textContent = body?.message || `登录失败（${response.status}）`; return }
    saveAuth({ access: body.tokens.accessToken, refresh: body.tokens.refreshToken, name: body.user?.name || phone })
    enterWorkbench()
  } catch {
    loginErr.textContent = '网络异常，请稍后重试'
  } finally {
    loginBtn.disabled = false
  }
})

document.getElementById('logoutBtn').addEventListener('click', () => {
  const auth = loadAuth()
  if (auth) {
    void fetch('/api/auth/logout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${auth.access}` },
      body: JSON.stringify({ refreshToken: auth.refresh })
    }).catch(() => undefined)
  }
  clearAuth()
  document.getElementById('loginPhone').value = ''
  document.getElementById('loginPwd').value = ''
  loginErr.textContent = ''
  showLogin('')
})

// 带鉴权的智能体请求：401 时静默 refresh 一次，仍失败回登录页
async function chatFetch(payload) {
  let auth = loadAuth()
  if (!auth) { showLogin('请先登录'); throw new Error('UNAUTHORIZED') }
  const doFetch = token => fetch('/web/api/agents/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
    body: JSON.stringify(payload)
  })
  let response = await doFetch(auth.access)
  if (response.status === 401) {
    const refreshRes = await fetch('/api/auth/refresh', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ refreshToken: auth.refresh })
    }).catch(() => null)
    const refreshBody = refreshRes?.ok ? await refreshRes.json().catch(() => null) : null
    if (refreshBody?.tokens) {
      auth = { ...auth, access: refreshBody.tokens.accessToken, refresh: refreshBody.tokens.refreshToken }
      saveAuth(auth)
      response = await doFetch(auth.access)
    }
  }
  if (response.status === 401) { clearAuth(); showLogin('登录已过期，请重新登录'); throw new Error('UNAUTHORIZED') }
  return response
}

function renderAgentChips() {
  agentsEl.innerHTML = ''
  for (const agent of AGENTS) {
    const chip = document.createElement('button')
    chip.className = 'agent-chip' + (agent.id === state.agent.id ? ' active' : '')
    chip.textContent = agent.name
    chip.onclick = () => { state.agent = agent; inputEl.placeholder = agent.placeholder; renderAgentChips(); renderTools(); renderHistory() }
    agentsEl.appendChild(chip)
  }
}

function renderMarkdown(text) {
  try {
    if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(text))
  } catch { /* 渲染失败回退纯文本 */ }
  return null
}

function addMessage(role, content) {
  document.getElementById('empty')?.remove()
  const div = document.createElement('div')
  if (role === 'user') {
    div.className = 'msg msg-user'
    div.textContent = content
  } else if (role === 'error') {
    div.className = 'msg msg-error'
    div.textContent = content
  } else {
    div.className = 'msg msg-ai'
    const md = document.createElement('div')
    md.className = 'md'
    const html = renderMarkdown(content)
    if (html) md.innerHTML = html
    else { md.style.whiteSpace = 'pre-wrap'; md.textContent = content }
    const actions = document.createElement('div')
    actions.className = 'msg-actions'
    const copyBtn = document.createElement('button')
    copyBtn.textContent = '复制'
    copyBtn.onclick = () => { void navigator.clipboard.writeText(content).then(() => { copyBtn.textContent = '已复制 ✓'; setTimeout(() => copyBtn.textContent = '复制', 1500) }) }
    const dlBtn = document.createElement('button')
    dlBtn.textContent = '下载 .md'
    dlBtn.onclick = () => {
      const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' })
      const a = document.createElement('a')
      a.href = URL.createObjectURL(blob)
      a.download = `${state.agent.name}-${new Date().toISOString().slice(0, 16).replace(/[:T]/g, '')}.md`
      a.click()
      URL.revokeObjectURL(a.href)
    }
    actions.append(copyBtn, dlBtn)
    div.append(md, actions)
  }
  chatEl.appendChild(div)
  chatEl.scrollTop = chatEl.scrollHeight
  return div
}

function renderHistory() {
  chatEl.innerHTML = ''
  const history = state.history[state.agent.id]
  if (!history.length) {
    const wrap = document.createElement('div')
    wrap.id = 'empty'
    wrap.style.cssText = 'flex:1; display:flex; flex-direction:column; justify-content:center; gap:20px; padding:20px;'
    const h = document.createElement('div')
    h.className = 'greeting'
    h.textContent = '有什么我能帮你的吗?'
    const grid = document.createElement('div')
    grid.className = 'suggestions'
    for (const q of (SAMPLES[state.agent.id] || [])) {
      const b = document.createElement('button')
      b.type = 'button'
      b.textContent = q
      b.onclick = () => { inputEl.value = q; void send() }
      grid.appendChild(b)
    }
    wrap.append(h, grid)
    chatEl.appendChild(wrap)
    return
  }
  for (const item of history) addMessage(item.role, item.content)
}

async function send() {
  if (state.busy || !loadAuth()) return
  const raw = inputEl.value.trim()
  if (!raw) return
  let content = raw
  if (state.attachments.length) {
    content = state.attachments.map(item => `[附件 ${item.name}]\n${item.text}`).join('\n\n') + '\n\n' + content
    state.attachments = []
    renderAttachChips()
  }
  if (state.platform) content += `\n目标平台：${state.platform}`
  const history = state.history[state.agent.id]
  history.push({ role: 'user', content })
  inputEl.value = ''
  addMessage('user', content)
  state.busy = true
  sendEl.disabled = true
  const typing = document.createElement('div')
  typing.className = 'msg msg-ai'
  typing.innerHTML = '<span class="typing"><i></i><i></i><i></i>&nbsp;正在生成，约需 1~6 分钟…</span>'
  chatEl.appendChild(typing)
  chatEl.scrollTop = chatEl.scrollHeight
  const controller = new AbortController()
  const timer = setTimeout(() => controller.abort(), 400000)
  try {
    const messages = history.slice(-10).map(item => ({ role: item.role, content: item.content }))
    const response = await chatFetch({ agent_id: state.agent.id, messages, 'openai-compatible': true, stream: false })
    const body = await response.json().catch(() => ({}))
    if (!response.ok) throw new Error(body?.message || `请求失败（HTTP ${response.status}），请稍后重试`)
    const reply = body?.choices?.[0]?.message?.content
    if (!reply) throw new Error('智能体未返回内容，请稍后重试')
    history.push({ role: 'assistant', content: reply })
    typing.remove()
    addMessage('assistant', reply)
  } catch (error) {
    typing.remove()
    if (error instanceof Error && error.message !== 'UNAUTHORIZED') {
      const message = error.name === 'AbortError' ? '生成超时（超过 6 分钟），请稍后重试或简化需求' : error.message
      addMessage('error', message)
    }
  } finally {
    clearTimeout(timer)
    state.busy = false
    sendEl.disabled = false
    inputEl.focus()
  }
}

sendEl.onclick = () => void send()
inputEl.addEventListener('keydown', event => {
  if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') { event.preventDefault(); void send() }
})
inputEl.placeholder = state.agent.placeholder

// ─── 平台快捷选择 + 文本附件（与 APP 行为对齐） ───────────────────────────
function renderTools() {
  const platformsEl = document.getElementById('platforms')
  platformsEl.innerHTML = ''
  if (state.agent.name === '选品分析师') {
    for (const p of PLATFORMS) {
      const chip = document.createElement('button')
      chip.type = 'button'
      chip.className = 'plat-chip' + (state.platform === p ? ' active' : '')
      chip.textContent = p
      chip.onclick = () => selectPlatform(p)
      platformsEl.appendChild(chip)
    }
  }
  renderAttachChips()
}

function selectPlatform(p) {
  const next = state.platform === p ? '' : p
  inputEl.value = applyPlatformToRequest(inputEl.value, next)
  state.platform = next
  renderTools()
}

const fileInput = document.getElementById('fileInput')
document.getElementById('uploadBtn').addEventListener('click', () => fileInput.click())
fileInput.addEventListener('change', () => {
  const file = fileInput.files?.[0]
  fileInput.value = ''
  if (!file) return
  if (!/\.(txt|md)$/i.test(file.name)) { addMessage('error', 'Web 版仅支持 .txt / .md 文本附件，更多类型请用桌面 APP'); return }
  if (state.attachments.length >= DOC_MAX_COUNT) { addMessage('error', `最多 ${DOC_MAX_COUNT} 个附件`); return }
  const reader = new FileReader()
  reader.onload = () => {
    let text = String(reader.result || '')
    if (text.length > DOC_CHAR_LIMIT) text = text.slice(0, DOC_CHAR_LIMIT) + '\n（附件过长，已截断至 12000 字）'
    state.attachments.push({ name: file.name, text })
    renderAttachChips()
  }
  reader.readAsText(file)
})

function renderAttachChips() {
  const wrap = document.getElementById('attachChips')
  wrap.innerHTML = ''
  state.attachments.forEach((item, index) => {
    const chip = document.createElement('span')
    chip.className = 'attach-chip'
    chip.append(document.createTextNode('📄 ' + item.name))
    const x = document.createElement('button')
    x.type = 'button'
    x.textContent = '✕'
    x.onclick = () => { state.attachments.splice(index, 1); renderAttachChips() }
    chip.appendChild(x)
    wrap.appendChild(chip)
  })
}

renderAgentChips()
renderTools()
renderHistory()
if (loadAuth()) enterWorkbench()
</script>
</body>
</html>
