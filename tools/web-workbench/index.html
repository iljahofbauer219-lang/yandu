function applyPlatformToRequest(text, platform) {
  const target = !platform || platform === 'Amazon' ? '亚马逊' : platform
  return PLATFORM_TEXT_RE.test(text) ? text.replace(PLATFORM_TEXT_RE, (_m, prefix) => prefix + target) : text
}

// ─── 登录态（sessionStorage，关浏览器即失效） ─────────────────────────────
function loadAuth() { try { return JSON.parse(sessionStorage.getItem(AUTH_KEY)) } catch { return null } }
function saveAuth(auth) { sessionStorage.setItem(AUTH_KEY, JSON.stringify(auth)) }
function clearAuth() { sessionStorage.removeItem(AUTH_KEY) }

function showLogin(message) {
  if (message) loginErr.textContent = message
  loginWrap.style.display = 'grid'
  userChip.style.display = 'none'
}

function enterWorkbench() {
  const auth = loadAuth()
  loginWrap.style.display = 'none'
  userNameEl.textContent = auth?.name || '已登录'
  userChip.style.display = 'flex'
  void syncPermissions()
}

// ─── 左侧一级栏目（按登录账号的模块权限过滤，与 APP 的 hasPermission 同口径） ───────────
let section = 'ai-employee'

function hasPerm(code) {
  const auth = loadAuth()
  if (!auth) return false
  if (auth.owner) return true
  return Array.isArray(auth.perms) && auth.perms.includes(code)
}

const visibleModules = () => MODULES.filter(item => hasPerm(item.perm))

function renderRail() {
  railNav.innerHTML = ''
  for (const item of visibleModules()) {
    const button = document.createElement('button')
    button.type = 'button'
    if (item.page === section) button.className = 'nav-active'
    button.innerHTML = `<span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true">${NAV_ICONS[item.icon] || ''}</svg></span><span class="nav-label"></span>`
    button.querySelector('.nav-label').textContent = item.label
    button.onclick = () => selectSection(item.page)
    railNav.appendChild(button)
  }
}

function selectSection(page) {
  const item = MODULES.find(module => module.page === page)
  section = page
  const employee = Boolean(item?.web)
  viewEmployee.hidden = !employee
  viewModule.hidden = employee
  agentsEl.style.display = employee ? 'flex' : 'none'
  brandSub.textContent = employee ? '报告方案类工作浏览器直接使用，无需安装 APP' : (item?.desc || '当前账号未分配模块权限')
  document.title = employee ? '砚都跨境 · Web 工作台' : `砚都跨境 · ${item?.label || 'Web 工作台'}`
  renderModuleView(employee ? item : (item || NO_PERM_MODULE))
  renderRail()
}

  const subtitle = document.createElement('p')

  header.append(title, subtitle)
  const card = document.createElement('div')

  const tag = document.createElement('span')

  const list = document.createElement('ul')
  for (const point of item.points) {
    const li = document.createElement('li')

  card.append(tag, note, list)

    card.appendChild(tip)
  } else {
    const actions = document.createElement('div')
    actions.className = 'module-actions'
    const download = document.createElement('a')
    download.href = '/download/'
    download.target = '_blank'
    download.className = 'primary'
    download.textContent = '下载桌面 APP ↗'
    actions.appendChild(download)
    if (hasPerm('menu.employee')) {
      const back = document.createElement('button')
      back.type = 'button'
      back.textContent = '返回 AI员工'
      back.onclick = () => selectSection('ai-employee')
      actions.appendChild(back)

function defaultSection() {
  const items = visibleModules()
  if (items.some(item => item.web)) return items.find(item => item.web).page
  return items[0]?.page || 'none'
}

async function syncPermissions() {
  const auth = loadAuth()
  if (!auth) return
  if (!auth.owner && !Array.isArray(auth.perms)) {
    try {
      const response = await authorizedFetch('/api/auth/me', { method: 'GET' })
      const profile = response.ok ? await response.json().catch(() => null) : null
      if (profile) saveAuth({ ...loadAuth(), owner: Boolean(profile.isOwner), perms: Array.isArray(profile.permissions) ? profile.permissions : [] })
      else if (loadAuth()) showLogin('登录已过期，请重新登录')
    } catch { /* 已过期场景由 authorizedFetch 回登录页；网络失败保留上次登录态 */ }
    if (loginWrap.style.display !== 'none') return
  }
  selectSection(defaultSection())
}

loginForm.addEventListener('submit', async event => {
  event.preventDefault()
  loginErr.textContent = ''
  const phone = document.getElementById('loginPhone').value.trim()
  const password = document.getElementById('loginPwd').value
  if (!/^1\d{10}$/.test(phone)) { loginErr.textContent = '手机号格式不正确'; return }
  loginBtn.disabled = true
  try {
    const response = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: phone, password })
    })
    const body = await response.json().catch(() => ({}))
    if (!response.ok) { loginErr.textContent = body?.message || `登录失败（${response.status}）`; return }
    saveAuth({
      access: body.tokens.accessToken,
      refresh: body.tokens.refreshToken,
      name: body.user?.name || phone,
      owner: Boolean(body.user?.isOwner),
      perms: Array.isArray(body.user?.permissions) ? body.user.permissions : (body.user?.permissions === 'ALL' ? [] : null)
    })
    enterWorkbench()
  } catch {
    loginErr.textContent = '网络异常，请稍后重试'
  } finally {
    loginBtn.disabled = false
  }
})

document.getElementById('logoutBtn').addEventListener('click', () => {
  const auth = loadAuth()
  if (auth) {
    void fetch('/api/auth/logout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${auth.access}` },
      body: JSON.stringify({ refreshToken: auth.refresh })
    }).catch(() => undefined)
  }
  clearAuth()
  railNav.innerHTML = ''
  document.getElementById('loginPhone').value = ''
  document.getElementById('loginPwd').value = ''
  loginErr.textContent = ''
  showLogin('')
})

// 带鉴权的请求：401 时静默 refresh 一次，仍失败回登录页（智能体对话与 /api/auth/me 共用）
async function authorizedFetch(path, init) {
  let auth = loadAuth()
  if (!auth) { showLogin('请先登录'); throw new Error('UNAUTHORIZED') }
  const send = token => fetch(path, { ...init, headers: { ...(init?.headers || {}), Authorization: `Bearer ${token}` } })
  let response = await send(auth.access)
  if (response.status === 401) {
    const refreshRes = await fetch('/api/auth/refresh', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ refreshToken: auth.refresh })
    }).catch(() => null)
    const refreshBody = refreshRes?.ok ? await refreshRes.json().catch(() => null) : null
    if (refreshBody?.tokens) {
      auth = { ...auth, access: refreshBody.tokens.accessToken, refresh: refreshBody.tokens.refreshToken }
      saveAuth(auth)
      response = await send(auth.access)
    }
  }
  if (response.status === 401) { clearAuth(); showLogin('登录已过期，请重新登录'); throw new Error('UNAUTHORIZED') }
  return response
}

const chatFetch = payload => authorizedFetch('/web/api/agents/chat/completions', {
  method: 'POST',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify(payload)
})

function renderAgentChips() {
  agentsEl.innerHTML = ''
  for (const agent of AGENTS) {
    const chip = document.createElement('button')
    chip.className = 'agent-chip' + (agent.id === state.agent.id ? ' active' : '')
    chip.textContent = agent.name
    chip.onclick = () => { state.agent = agent; inputEl.placeholder = agent.placeholder; renderAgentChips(); renderTools(); renderHistory() }
    agentsEl.appendChild(chip)
  }
}

function renderMarkdown(text) {
  try {
    if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(text))
  } catch { /* 渲染失败回退纯文本 */ }
  return null
}

function addMessage(role, content) {
  document.getElementById('empty')?.remove()
  const div = document.createElement('div')
  if (role === 'user') {
    div.className = 'msg msg-user'
    div.textContent = content
  } else if (role === 'error') {
    div.className = 'msg msg-error'
    div.textContent = content
  } else {
    div.className = 'msg msg-ai'
    const md = document.createElement('div')
    md.className = 'md'
    const html = renderMarkdown(content)
    if (html) md.innerHTML = html
    else { md.style.whiteSpace = 'pre-wrap'; md.textContent = content }
    const actions = document.createElement('div')
    actions.className = 'msg-actions'
    const copyBtn = document.createElement('button')
    copyBtn.textContent = '复制'
    copyBtn.onclick = () => { void navigator.clipboard.writeText(content).then(() => { copyBtn.textContent = '已复制 ✓'; setTimeout(() => copyBtn.textContent = '复制', 1500) }) }
    const dlBtn = document.createElement('button')
    dlBtn.textContent = '下载 .md'
    dlBtn.onclick = () => {
      const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' })
      const a = document.createElement('a')
      a.href = URL.createObjectURL(blob)
      a.download = `${state.agent.name}-${new Date().toISOString().slice(0, 16).replace(/[:T]/g, '')}.md`
      a.click()
      URL.revokeObjectURL(a.href)
    }
    actions.append(copyBtn, dlBtn)
    div.append(md, actions)
  }
  chatEl.appendChild(div)
  chatEl.scrollTop = chatEl.scrollHeight
  return div
}

function renderHistory() {
  chatEl.innerHTML = ''
  const history = state.history[state.agent.id]
  if (!history.length) {
    const wrap = document.createElement('div')
    wrap.id = 'empty'
    wrap.style.cssText = 'flex:1; display:flex; flex-direction:column; justify-content:center; gap:20px; padding:20px;'
    const h = document.createElement('div')
    h.className = 'greeting'
    h.textContent = '有什么我能帮你的吗?'
    const grid = document.createElement('div')
    grid.className = 'suggestions'
    for (const q of (SAMPLES[state.agent.id] || [])) {
      const b = document.createElement('button')
      b.type = 'button'
      b.textContent = q
      b.onclick = () => { inputEl.value = q; void send() }
      grid.appendChild(b)
    }
    wrap.append(h, grid)
    chatEl.appendChild(wrap)
    return
  }
  for (const item of history) addMessage(item.role, item.content)
}

async function send() {
  if (state.busy || !loadAuth()) return
  const raw = inputEl.value.trim()
  if (!raw) return
  let content = raw
  if (state.attachments.length) {
    content = state.attachments.map(item => `[附件 ${item.name}]\n${item.text}`).join('\n\n') + '\n\n' + content
    state.attachments = []
    renderAttachChips()
  }
  if (state.platform) content += `\n目标平台：${state.platform}`
  const history = state.history[state.agent.id]
  history.push({ role: 'user', content })
  inputEl.value = ''
  addMessage('user', content)
  state.busy = true
  sendEl.disabled = true
  const typing = document.createElement('div')
  typing.className = 'msg msg-ai'
  typing.innerHTML = '<span class="typing"><i></i><i></i><i></i>&nbsp;正在生成，约需 1~6 分钟…</span>'
  chatEl.appendChild(typing)
  chatEl.scrollTop = chatEl.scrollHeight
  const controller = new AbortController()
  const timer = setTimeout(() => controller.abort(), 400000)
  try {
    const messages = history.slice(-10).map(item => ({ role: item.role, content: item.content }))
    const response = await chatFetch({ agent_id: state.agent.id, messages, 'openai-compatible': true, stream: false })
    const body = await response.json().catch(() => ({}))
    if (!response.ok) throw new Error(body?.message || `请求失败（HTTP ${response.status}），请稍后重试`)
    const reply = body?.choices?.[0]?.message?.content
    if (!reply) throw new Error('智能体未返回内容，请稍后重试')
    history.push({ role: 'assistant', content: reply })
    typing.remove()
    addMessage('assistant', reply)
  } catch (error) {
    typing.remove()
    if (error instanceof Error && error.message !== 'UNAUTHORIZED') {
      const message = error.name === 'AbortError' ? '生成超时（超过 6 分钟），请稍后重试或简化需求' : error.message
      addMessage('error', message)
    }
  } finally {
    clearTimeout(timer)
    state.busy = false
    sendEl.disabled = false
    inputEl.focus()
  }
}

sendEl.onclick = () => void send()
inputEl.addEventListener('keydown', event => {
  if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') { event.preventDefault(); void send() }
})
inputEl.placeholder = state.agent.placeholder

// ─── 平台快捷选择 + 文本附件（与 APP 行为对齐） ───────────────────────────
function renderTools() {
  const platformsEl = document.getElementById('platforms')
  platformsEl.innerHTML = ''
  if (state.agent.name === '选品分析师') {
    for (const p of PLATFORMS) {
      const chip = document.createElement('button')
      chip.type = 'button'
      chip.className = 'plat-chip' + (state.platform === p ? ' active' : '')
      chip.textContent = p
      chip.onclick = () => selectPlatform(p)
      platformsEl.appendChild(chip)
    }
  }
  renderAttachChips()
}

function selectPlatform(p) {
  const next = state.platform === p ? '' : p
  inputEl.value = applyPlatformToRequest(inputEl.value, next)
  state.platform = next
  renderTools()
}

const fileInput = document.getElementById('fileInput')
document.getElementById('uploadBtn').addEventListener('click', () => fileInput.click())
fileInput.addEventListener('change', () => {
  const file = fileInput.files?.[0]
  fileInput.value = ''
  if (!file) return
  if (!/\.(txt|md)$/i.test(file.name)) { addMessage('error', 'Web 版仅支持 .txt / .md 文本附件，更多类型请用桌面 APP'); return }
  if (state.attachments.length >= DOC_MAX_COUNT) { addMessage('error', `最多 ${DOC_MAX_COUNT} 个附件`); return }
  const reader = new FileReader()
  reader.onload = () => {
    let text = String(reader.result || '')
    if (text.length > DOC_CHAR_LIMIT) text = text.slice(0, DOC_CHAR_LIMIT) + '\n（附件过长，已截断至 12000 字）'
    state.attachments.push({ name: file.name, text })
    renderAttachChips()
  }
  reader.readAsText(file)
})

function renderAttachChips() {
  const wrap = document.getElementById('attachChips')
  wrap.innerHTML = ''
  state.attachments.forEach((item, index) => {
    const chip = document.createElement('span')
    chip.className = 'attach-chip'
    chip.append(document.createTextNode('📄 ' + item.name))
    const x = document.createElement('button')
    x.type = 'button'
    x.textContent = '✕'
    x.onclick = () => { state.attachments.splice(index, 1); renderAttachChips() }
    chip.appendChild(x)
    wrap.appendChild(chip)
  })
}

renderAgentChips()
renderTools()
renderHistory()
if (loadAuth()) enterWorkbench()
