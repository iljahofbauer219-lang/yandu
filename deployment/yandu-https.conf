map $http_cookie $yandu_api_backend {
    default "http://127.0.0.1:8787";
    ~*__Host-yandu_harness= "http://127.0.0.1:8788";
}

# 产品详情页限流：该路径公开无鉴权，返回的是净化后的第三方抓取 HTML。
# 20r/s + burst 40 足以覆盖一次正常加载（1 个 HTML + 最多 24 张 assets；
# assets 是 no-cache 会每次回源，故 burst 需放宽），同时挡住批量刷页。
limit_req_zone $binary_remote_addr zone=product_pages:10m rate=20r/s;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 114.55.149.192;
    ssl_certificate /etc/nginx/yandu-tls/cert.pem;
    ssl_certificate_key /etc/nginx/yandu-tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /harness/ {
        proxy_pass http://127.0.0.1:8788/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:8788/assets/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /plugins/ {
        proxy_pass http://127.0.0.1:8788/plugins/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Harness uses absolute /api/* URLs. Only its signed session cookie is
    # allowed to select the gateway; all other application API calls stay on app.
    location /api/ {
        proxy_pass $yandu_api_backend;
        client_max_body_size 200m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # 跨境导航静态站（vite 构建产物，amz123 镜像）
    location /nav/ {
        alias /opt/www/crossborder-nav/;
        index index.html;
        charset utf-8;
        add_header X-Content-Type-Options "nosniff" always;

        # index.html 始终重新校验：vite 产物的 hash 在 CSS/JS 文件名里，
        # index.html 缓存太久会导致浏览器拿到旧 hash、加载到旧版资源
        location = /nav/index.html {
            add_header Cache-Control "no-cache, must-revalidate" always;
        }
        # 字体/CSS/JS 强缓存
        location ~ ^/nav/.+\.(css|js|woff2?|ttf|otf|eot|svg|ico)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable" always;
        }
        # logo/截图图片为固定文件名引用（无 hash），每次加载重新校验，确保更新即时生效
        location ~ ^/nav/.+\.(png|jpg|jpeg|gif|webp)$ {
            add_header Cache-Control "no-cache" always;
        }

        # SPA 路由 fallback
        try_files $uri $uri/ /nav/index.html;
    }

    # 产品详情页：公开无鉴权，内容是净化后的第三方抓取 HTML。
    # 安全响应头（CSP script-src 'none' + sandbox、nosniff、no-referrer、noindex）由 Fastify 统一下发，
    # nginx 默认透传上游响应头，此处刻意不写 add_header：
    # location 内一旦出现 add_header，server 层的 HSTS 就不再被继承，反而会少一条头。
    # proxy_pass 结尾不带 / ，保持原始 URI 原样转发（带 / 会剥掉 location 前缀而 404）。
    location /product-pages/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        client_max_body_size 1m;
        limit_req zone=product_pages burst=40 nodelay;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 200m;
    }
}
